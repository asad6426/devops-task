name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once; never cancel one half-way.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build-push:
    name: Build multi-arch, scan, push, sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
      id-token: write # keyless cosign signing
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/devops-task"
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION is not semver: $version"; exit 1; }
          short_sha="${GITHUB_SHA::7}"
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "sha_tag=sha-${short_sha}"
            echo "tags<<EOF"
            echo "${image}:sha-${short_sha}"
            echo "${image}:${version}"
            echo "${image}:latest"
            echo "EOF"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan the amd64 build before anything is pushed: CRITICAL vulns never reach the registry.
      - name: Build amd64 for pre-push scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scan:${{ github.sha }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

      - name: Trivy gate (CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build & push linux/amd64 + linux/arm64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}\`"
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`"
            echo "- digest \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-ec2:
    name: Deploy to EC2 (SSM) + smoke test + auto-rollback
    needs: build-push
    runs-on: ubuntu-24.04
    # Skipped automatically until the AWS variables are configured (see README -> CI/CD configuration).
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != '' }}
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS STS, no static keys
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_REF: ${{ needs.build-push.outputs.image }}:${{ needs.build-push.outputs.sha_tag }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Run deploy script on the instance via SSM
        id: ssm
        run: |
          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${IMAGE_REF} (run ${GITHUB_RUN_ID})" \
            --timeout-seconds 600 \
            --parameters "commands=[\"/usr/local/bin/devops-task-deploy ${IMAGE_REF}\"]" \
            --query Command.CommandId --output text)
          echo "command_id=${cmd_id}" >> "$GITHUB_OUTPUT"
          echo "SSM command: ${cmd_id}"

          # Poll until the command finishes (aws ssm wait gives up after ~100s).
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output yaml

          if [[ "$status" != "Success" ]]; then
            echo "::error::Deploy failed (status=${status}). The instance rolled back to the previous image automatically."
            exit 1
          fi

      - name: External smoke test
        if: ${{ vars.APP_URL != '' }}
        run: |
          for i in $(seq 1 10); do
            curl -fsS -m 5 "${{ vars.APP_URL }}/health" && exit 0
            sleep 3
          done
          echo "::error::External /health check failed"
          exit 1
