apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devops-task

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

# The Secret is generated from a git-ignored env file (copy secret.env.example -> secret.env).
# Nothing sensitive is committed; the generated name gets a content hash, so changing a
# secret value automatically triggers a rolling restart.
secretGenerator:
  - name: devops-task-secret
    envs:
      - secret.env

# Change the image tag in one place (CI would run `kustomize edit set image`).
images:
  - name: ghcr.io/asad6426/devops-task
    newTag: "1.0.0"
