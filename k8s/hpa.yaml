# Requires metrics-server (see README).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-task
  labels:
    app.kubernetes.io/name: devops-task
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-task
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
