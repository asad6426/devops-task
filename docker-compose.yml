# Local stack.
#   App only:            docker compose up -d --build
#   App + observability: docker compose --profile monitoring up -d --build
#
# Network layout:
#   frontend   - normal bridge; only `app` (8080) and `grafana` (3000) publish ports.
#   monitoring - `internal: true` bridge (no route to outside, nothing published);
#                Prometheus, Loki, Alloy, Node Exporter, cAdvisor live here only.
name: devops-task

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

services:
  app:
    <<: *hardening
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: devops-task:${APP_VERSION:-1.0.0}
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      # Exposes /debug/error and /debug/slow so you can trigger alerts locally. Never enabled in k8s/EC2.
      ENABLE_DEBUG_ENDPOINTS: ${ENABLE_DEBUG_ENDPOINTS:-true}
    read_only: true
    cap_drop: [ALL]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python3", "-m", "app.healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks: [frontend, monitoring]

  # ------------------------------------------------------------------ monitoring
  prometheus:
    <<: *hardening
    profiles: [monitoring]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    networks: [monitoring]

  loki:
    <<: *hardening
    profiles: [monitoring]
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    networks: [monitoring]

  alloy:
    <<: *hardening
    profiles: [monitoring]
    image: grafana/alloy:v1.5.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only Docker API access for container discovery + log tailing.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    networks: [monitoring]

  node-exporter:
    <<: *hardening
    profiles: [monitoring]
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
    # Host PID namespace so process/CPU stats reflect the host, not the container.
    pid: host
    read_only: true
    cap_drop: [ALL]
    volumes:
      # Whole host FS read-only (on a real Linux host add ",rslave" so later mounts are visible;
      # Docker Desktop rejects rslave because its root mount is private).
      - /:/host:ro
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 128M }
    networks: [monitoring]

  cadvisor:
    <<: *hardening
    profiles: [monitoring]
    image: ghcr.io/google/cadvisor:v0.53.0
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,cpu_topology,resctrl,advtcp,process
    # privileged is needed to read all cgroup stats + /dev/kmsg (OOM events); see README "Host access".
    privileged: true
    # cgroup v2 gives each container a private cgroup namespace; cAdvisor must see the host's.
    cgroup: host
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    networks: [monitoring]

  grafana:
    <<: *hardening
    profiles: [monitoring]
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      # Required: set in .env (see .env.example). Compose refuses to start without them.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/application.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    networks: [frontend, monitoring]

networks:
  frontend: {}
  monitoring:
    internal: true

volumes:
  prometheus-data: {}
  loki-data: {}
  alloy-data: {}
  grafana-data: {}

